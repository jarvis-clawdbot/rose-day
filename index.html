<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Rose Day 🌹</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a0a 0%, #2d0a0a 25%, #1a0505 50%, #2d1515 75%, #1a0a0a 100%);
            font-family: 'Playfair Display', serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Romantic background pattern */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(ellipse at 20% 30%, rgba(255, 100, 100, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(255, 150, 150, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(200, 50, 80, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* Floating petals container */
        .petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            font-size: 24px;
            opacity: 0.7;
            animation: floatPetal linear infinite;
            filter: drop-shadow(0 0 10px rgba(255, 100, 100, 0.5));
        }

        @keyframes floatPetal {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(720deg) scale(0.5);
                opacity: 0;
            }
        }

        /* Main container */
        .main-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        /* Decorative rose corners */
        .corner-rose {
            position: fixed;
            font-size: 60px;
            opacity: 0.3;
            filter: drop-shadow(0 0 20px rgba(255, 100, 100, 0.6));
            z-index: 1;
        }

        .corner-rose.top-left {
            top: 20px;
            left: 20px;
            animation: gentleSway 4s ease-in-out infinite;
        }

        .corner-rose.top-right {
            top: 20px;
            right: 20px;
            animation: gentleSway 4s ease-in-out infinite 1s;
        }

        .corner-rose.bottom-left {
            bottom: 20px;
            left: 20px;
            animation: gentleSway 4s ease-in-out infinite 2s;
        }

        .corner-rose.bottom-right {
            bottom: 20px;
            right: 20px;
            animation: gentleSway 4s ease-in-out infinite 3s;
        }

        @keyframes gentleSway {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.1); }
        }

        /* Title section */
        .title-section {
            text-align: center;
            margin-bottom: 60px;
        }

        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: rgba(255, 200, 200, 0.8);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 20px;
            animation: fadeInDown 1s ease-out;
            font-weight: 300;
        }

        .main-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3rem, 10vw, 8rem);
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e, #ffd4d4, #ff8e8e, #ff6b6b);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite, titleFloat 3s ease-in-out infinite;
            text-shadow: none;
            filter: drop-shadow(0 0 30px rgba(255, 100, 100, 0.5));
            line-height: 1.2;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .rose-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            animation: fadeIn 1.5s ease-out;
        }

        .rose-divider span {
            font-size: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }

        .divider-line {
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff6b6b, transparent);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Rose envelope/letter */
        .envelope-container {
            perspective: 1000px;
            margin-top: 20px;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .envelope {
            position: relative;
            width: 280px;
            height: 200px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .envelope:hover {
            transform: scale(1.05) translateY(-5px);
        }

        .envelope-body {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #8B0000, #B22222, #DC143C);
            border-radius: 10px;
            box-shadow: 
                0 20px 60px rgba(139, 0, 0, 0.4),
                0 10px 30px rgba(0, 0, 0, 0.3),
                inset 0 -5px 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .envelope-body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.05) 50%, transparent 60%);
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(180deg, #A52A2A, #8B0000);
            clip-path: polygon(0 0, 50% 100%, 100% 0);
            transform-origin: top center;
            z-index: 2;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .envelope-rose {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            z-index: 3;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.4));
            animation: roseGlow 2s ease-in-out infinite;
        }

        @keyframes roseGlow {
            0%, 100% {
                filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.4)) drop-shadow(0 0 20px rgba(255, 100, 100, 0.3));
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.4)) drop-shadow(0 0 40px rgba(255, 100, 100, 0.6));
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        .envelope-heart {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 1.5rem;
            animation: heartbeat 1.5s ease-in-out infinite;
            z-index: 3;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.2); }
            60% { transform: scale(1); }
        }

        /* Click me text */
        .click-text {
            margin-top: 30px;
            text-align: center;
            animation: bounceText 2s ease-in-out infinite;
        }

        .click-text p {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #ff8e8e;
            text-shadow: 0 0 20px rgba(255, 100, 100, 0.5);
        }

        .click-text .arrow {
            font-size: 2rem;
            display: block;
            margin-top: 10px;
            animation: bounceArrow 1s ease-in-out infinite;
        }

        @keyframes bounceText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes bounceArrow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        /* Sparkles */
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, #fff 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        .footer p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            color: rgba(255, 200, 200, 0.6);
            letter-spacing: 2px;
        }

        .footer .heart {
            color: #ff6b6b;
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .subtitle {
                font-size: 1rem;
                letter-spacing: 4px;
            }

            .envelope {
                width: 220px;
                height: 160px;
            }

            .envelope-rose {
                font-size: 3rem;
            }

            .corner-rose {
                font-size: 40px;
            }

            .click-text p {
                font-size: 1.4rem;
            }
        }

        /* Page transition */
        .page-transition {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #ff6b6b, #8B0000);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .page-transition.active {
            opacity: 1;
            pointer-events: all;
        }

        .page-transition .rose {
            font-size: 8rem;
            animation: spinRose 1s ease-in-out infinite;
        }

        @keyframes spinRose {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }
    </style>
</head>
<body>
    <!-- Background pattern -->
    <div class="bg-pattern"></div>

    <!-- Floating petals -->
    <div class="petals-container" id="petalsContainer"></div>

    <!-- Corner roses -->
    <div class="corner-rose top-left">🌹</div>
    <div class="corner-rose top-right">🌹</div>
    <div class="corner-rose bottom-left">🌹</div>
    <div class="corner-rose bottom-right">🌹</div>

    <!-- Main content -->
    <div class="main-container">
        <div class="title-section">
            <p class="subtitle">✨ February 7th ✨</p>
            <h1 class="main-title">Happy Rose Day</h1>
            <div class="rose-divider">
                <div class="divider-line"></div>
                <span>🌹</span>
                <div class="divider-line"></div>
            </div>
        </div>

        <div class="envelope-container">
            <div class="envelope" id="envelope" onclick="openLetter()">
                <div class="envelope-body"></div>
                <div class="envelope-flap"></div>
                <div class="envelope-rose">🌹</div>
                <div class="envelope-heart">💕</div>
            </div>
        </div>

        <div class="click-text">
            <p>Click on the rose to open your letter</p>
            <span class="arrow">👆</span>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>Made by Shubham <span class="heart">❤️</span></p>
    </div>

    <!-- Page transition -->
    <div class="page-transition" id="pageTransition">
        <span class="rose">🌹</span>
    </div>

    <script>
        // Create floating petals
        function createPetals() {
            const container = document.getElementById('petalsContainer');
            const petalEmojis = ['🌹', '🥀', '🌸', '💮', '🏵️', '💐', '❀', '✿'];
            
            for (let i = 0; i < 25; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
                petal.style.left = Math.random() * 100 + '%';
                petal.style.fontSize = (Math.random() * 20 + 15) + 'px';
                petal.style.animationDuration = (Math.random() * 10 + 10) + 's';
                petal.style.animationDelay = (Math.random() * 15) + 's';
                container.appendChild(petal);
            }
        }

        // Create sparkles around envelope
        function createSparkles() {
            const envelope = document.querySelector('.envelope-container');
            for (let i = 0; i < 8; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = (Math.random() * 100) + '%';
                sparkle.style.top = (Math.random() * 100) + '%';
                sparkle.style.animationDelay = (Math.random() * 2) + 's';
                envelope.appendChild(sparkle);
            }
        }

        // Open letter function
        function openLetter() {
            const transition = document.getElementById('pageTransition');
            transition.classList.add('active');
            
            setTimeout(() => {
                window.location.href = 'letter.html';
            }, 800);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            createPetals();
            createSparkles();
        });

        // Add more petals periodically
        setInterval(() => {
            const container = document.getElementById('petalsContainer');
            if (container.children.length < 40) {
                const petalEmojis = ['🌹', '🥀', '🌸', '💮', '🏵️'];
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
                petal.style.left = Math.random() * 100 + '%';
                petal.style.fontSize = (Math.random() * 20 + 15) + 'px';
                petal.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(petal);

                // Remove petal after animation
                setTimeout(() => {
                    petal.remove();
                }, 20000);
            }
        }, 3000);
    </script>
</body>
</html>
